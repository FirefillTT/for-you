name: Сохранить ответы

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Забрать ответы из ntfy
        env:
          TOPIC: fy-cfe537d348c6fbfc59-d
        run: node .github/scripts/collect.mjs
      - name: Закоммитить
        run: |
          if git diff --quiet -- answers.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add answers.json
          git commit -m "Новые ответы"
          git pull --rebase
          git push
